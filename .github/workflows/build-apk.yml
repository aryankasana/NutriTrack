name: Build NutriTrack Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NutriTrack_Android_Project.zip
        run: |
          if [ -f "NutriTrack_Android_Project.zip" ]; then
            unzip -q -o NutriTrack_Android_Project.zip
            if [ -d "NutriTrack" ]; then
              cp -r NutriTrack/. .
              rm -rf NutriTrack
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NutriTrack Debug APK (Build #${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
